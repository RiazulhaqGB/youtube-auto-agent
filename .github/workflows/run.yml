name: auto-upload
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,15 * * *'

jobs:
  auto-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create client_secret.json
        env:
          CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          printf '{"installed":{"client_id":"%s","client_secret":"%s","redirect_uris":["http://localhost"],"auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}}' "$CLIENT_ID" "$CLIENT_SECRET" > client_secret.json

      - name: Create token.json
        env:
          REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          printf '{"refresh_token":"%s","client_id":"%s","client_secret":"%s","token_uri":"https://oauth2.googleapis.com/token","scopes":["https://www.googleapis.com/auth/youtube.upload"]}' "$REFRESH_TOKEN" "$CLIENT_ID" "$CLIENT_SECRET" > token.json

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run python main.py
        run: python main.py
