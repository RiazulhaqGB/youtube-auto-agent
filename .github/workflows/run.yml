name: auto-upload
on:
  workflow_dispatch:
  schedule:
    # Subah 8 baje PKT = 3 AM UTC
    # Raat 8 baje PKT = 3 PM UTC
    - cron: '0 3,15 * * *'

jobs:
  auto-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create token.json
        run: echo '${{ secrets.TOKEN_JSON }}' > token.json

      - name: Create client_secret.json
        run: echo '${{ secrets.CLIENT_SECRETS }}' > client_secret.json

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run python main.py
        run: python main.py
