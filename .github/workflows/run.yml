name: Daily Auto YouTube Agent

on:
  schedule:
    # Rozana Pakistan time 9:00 AM = UTC 4:00 AM pe chalega
    - cron: '0 4 * * *'
  workflow_dispatch: # Manual ka option bhi rahega

jobs:
  auto-create-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg for Audio
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Create Folders
        run: mkdir -p output images

      - name: Generate Video Daily
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Upload Done
        run: echo "Daily Video Uploaded Successfully!"
