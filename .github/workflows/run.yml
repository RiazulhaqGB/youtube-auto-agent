name: Trending YouTube Auto Agent - 2X Daily

on:
  schedule:
    - cron: '0 4 * * *'  # Subah 9 AM Pak
    - cron: '0 16 * * *' # Sham 9 PM Pak
  workflow_dispatch:

jobs:
  auto-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python 3.10 Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Libraries Install
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install edge-tts moviepy==1.0.3 Pillow requests

      - name: Run Trending Agent
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python main.py

      - name: Upload Done
        if: always()
        run: echo "Jani Trending Video Ready - 9AM & 9PM Done!"
