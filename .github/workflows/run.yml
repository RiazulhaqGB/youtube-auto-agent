name: Trending YouTube Auto Agent - 2X Daily

on:
  schedule:
    - cron: '0 4 * * *'   # Subah 9 AM Pak - Trending Check 1
    - cron: '0 16 * * *'  # Raat 9 PM Pak - Trending Check 2
  workflow_dispatch:

jobs:
  auto-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Python 3.10 Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Libraries Install
        run: |
          pip install --upgrade pip
          pip install edge-tts moviepy==1.0.3 pillow google-api-python-client google-auth-httplib2 google-auth-oauthlib requests

      - name: Create Credentials
        env:
          YT_CREDS: ${{ secrets.YT_CREDS }}
        run: |
          echo "$YT_CREDS" > credentials.json

      - name: Run Trending Agent
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          python main.py

      - name: Upload Done
        if: always()
        run: echo "Jani Trending Video Ready - 9AM & 9PM Done!"
