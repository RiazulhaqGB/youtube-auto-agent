name: YouTube Auto Agent Daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *'
jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - run: python main.py
      - name: Upload Video and Thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: final-video-and-thumbnail
          path: |
            final_video.mp4
            thumbnail.jpg
            voice.mp3
