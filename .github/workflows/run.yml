name: Trending YouTube Auto Agent - 2X Daily

on:
  schedule:
    - cron: '0 3 * * *'   # Subah 8 baje Pakistan (3am UTC)
    - cron: '0 15 * * *'  # Sham 8 baje Pakistan (3pm UTC)
  workflow_dispatch:       # Manual button bhi rahega

jobs:
  auto-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 15 min me agar na bane to auto cancel, hang nahi hoga
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Auto Agent
        run: python main.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
