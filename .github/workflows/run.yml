name: Daily Auto YouTube Agent

on:
  schedule:
    - cron: '0 3,15 * * *' # Subah 8 / Sham 8 PKT
  workflow_dispatch:

jobs:
  auto-create-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check FFmpeg (Already Installed)
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "FFmpeg not found, installing fast..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          else
            echo "FFmpeg already installed"
          fi
          ffmpeg -version

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Video Daily
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
